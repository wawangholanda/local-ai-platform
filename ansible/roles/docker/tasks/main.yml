---
- name: Validate supported OS, release, and architecture for Docker
  ansible.builtin.assert:
    that:
      - >-
        (
          ansible_distribution == 'Debian'
          and ansible_distribution_release in ['bookworm', 'trixie']
          and ansible_architecture in ['x86_64', 'aarch64', 'armv7l', 'ppc64le']
        )
        or
        (
          ansible_distribution == 'Ubuntu'
          and ansible_distribution_release in ['jammy', 'noble', 'resolute', 'stonking']
          and ansible_architecture in ['x86_64', 'aarch64', 'armv7l', 'ppc64le', 's390x']
        )
    fail_msg: >-
      Docker role supports only documented Debian/Ubuntu releases and
      architectures. Detected {{ ansible_distribution }}
      {{ ansible_distribution_version }} ({{ ansible_distribution_release }})
      with architecture {{ ansible_architecture }}.

- name: Install Docker dependencies
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: true

- name: Create Docker keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Add Docker GPG key
  ansible.builtin.get_url:
    url: "https://download.docker.com/linux/{{ 'debian' if ansible_distribution == 'Debian' else 'ubuntu' }}/gpg"
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Add Docker repository
  ansible.builtin.deb822_repository:
    name: docker
    types: deb
    uris:
      - "https://download.docker.com/linux/{{ 'debian' if ansible_distribution == 'Debian' else 'ubuntu' }}"
    suites:
      - "{{ ansible_distribution_release }}"
    components:
      - stable
    architectures:
      - "{{ {'x86_64': 'amd64', 'aarch64': 'arm64', 'armv7l': 'armhf', 'ppc64le': 'ppc64el', 's390x': 's390x'}.get(ansible_architecture, ansible_architecture) }}"
    signed_by: /etc/apt/keyrings/docker.asc
    state: present

- name: Install Docker Engine
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Ensure Docker service enabled
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Add administrative user to docker group
  ansible.builtin.user:
    name: "{{ local_ai_admin_user }}"
    groups: docker
    append: true
