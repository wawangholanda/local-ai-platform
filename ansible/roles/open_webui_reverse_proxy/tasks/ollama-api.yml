---
- name: Validate Ollama API hostname and API key
  ansible.builtin.assert:
    that:
      - open_webui_proxy_ollama_domain | length > 0
      - >-
        open_webui_proxy_ollama_domain is
        match('^[A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?([.][A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?)+$')
      - >-
        lookup('ansible.builtin.env', 'OLLAMA_API_KEY') | trim
        is match('^[a-fA-F0-9]{64}$')
    fail_msg: >-
      The derived Ollama API hostname is invalid or OLLAMA_API_KEY is missing
      or invalid. Run quick-start.sh to load and validate the local environment.
  no_log: true

- name: Retrieve existing Cloudflare DNS records for the Ollama API hostname
  ansible.builtin.uri:
    url: >-
      https://api.cloudflare.com/client/v4/zones/{{
      open_webui_proxy_cloudflare_zone_id }}/dns_records?name={{
      open_webui_proxy_ollama_domain | urlencode }}&per_page=100
    method: GET
    headers:
      Authorization: "Bearer {{ lookup('ansible.builtin.env', 'CLOUDFLARE_API_TOKEN') | trim }}"
      Accept: application/json
    return_content: true
    status_code: 200
    validate_certs: true
  failed_when: not (ollama_api_dns_records.json.success | default(false) | bool)
  delegate_to: localhost
  become: false
  register: ollama_api_dns_records
  no_log: true

- name: Refuse conflicting DNS record types for the Ollama API hostname
  ansible.builtin.assert:
    that:
      - >-
        ollama_api_dns_records.json.result
        | selectattr('type', 'in', ['CNAME', 'NS', 'AAAA'])
        | list | length == 0
    fail_msg: >-
      The Ollama API hostname has a conflicting CNAME, NS, or AAAA record.
      Review the DNS records manually before continuing.
  no_log: true

- name: Collect existing A records for the Ollama API hostname
  ansible.builtin.set_fact:
    ollama_api_existing_a_records: >-
      {{ ollama_api_dns_records.json.result
         | selectattr('type', 'equalto', 'A') | list }}

- name: Refuse multiple A records for the Ollama API hostname
  ansible.builtin.assert:
    that:
      - ollama_api_existing_a_records | length <= 1
    fail_msg: >-
      More than one A record exists for the Ollama API hostname.
      Review the records manually to avoid overwriting unrelated destinations.

- name: Create DNS-only A record for the Ollama API hostname
  ansible.builtin.uri:
    url: "https://api.cloudflare.com/client/v4/zones/{{ open_webui_proxy_cloudflare_zone_id }}/dns_records"
    method: POST
    headers:
      Authorization: "Bearer {{ lookup('ansible.builtin.env', 'CLOUDFLARE_API_TOKEN') | trim }}"
      Accept: application/json
    body_format: json
    body:
      type: A
      name: "{{ open_webui_proxy_ollama_domain }}"
      content: "{{ open_webui_proxy_tailscale_ip }}"
      ttl: 1
      proxied: false
    return_content: true
    status_code: 200
    validate_certs: true
  failed_when: not (ollama_api_dns_create.json.success | default(false) | bool)
  delegate_to: localhost
  become: false
  register: ollama_api_dns_create
  when: ollama_api_existing_a_records | length == 0
  no_log: true

- name: Update the Ollama API A record to the current Tailscale address
  ansible.builtin.uri:
    url: >-
      https://api.cloudflare.com/client/v4/zones/{{
      open_webui_proxy_cloudflare_zone_id }}/dns_records/{{
      ollama_api_existing_a_records[0].id }}
    method: PATCH
    headers:
      Authorization: "Bearer {{ lookup('ansible.builtin.env', 'CLOUDFLARE_API_TOKEN') | trim }}"
      Accept: application/json
    body_format: json
    body:
      content: "{{ open_webui_proxy_tailscale_ip }}"
      ttl: 1
      proxied: false
    return_content: true
    status_code: 200
    validate_certs: true
  failed_when: not (ollama_api_dns_update.json.success | default(false) | bool)
  delegate_to: localhost
  become: false
  register: ollama_api_dns_update
  when:
    - ollama_api_existing_a_records | length == 1
    - >-
      ollama_api_existing_a_records[0].content != open_webui_proxy_tailscale_ip
      or ollama_api_existing_a_records[0].proxied | bool
  no_log: true

- name: Verify Cloudflare DNS records for the Ollama API hostname
  ansible.builtin.uri:
    url: >-
      https://api.cloudflare.com/client/v4/zones/{{
      open_webui_proxy_cloudflare_zone_id }}/dns_records?name={{
      open_webui_proxy_ollama_domain | urlencode }}&per_page=100
    method: GET
    headers:
      Authorization: "Bearer {{ lookup('ansible.builtin.env', 'CLOUDFLARE_API_TOKEN') | trim }}"
      Accept: application/json
    return_content: true
    status_code: 200
    validate_certs: true
  failed_when: not (ollama_api_dns_verify.json.success | default(false) | bool)
  delegate_to: localhost
  become: false
  register: ollama_api_dns_verify
  no_log: true

- name: Assert the Ollama API hostname has exactly one A record
  ansible.builtin.assert:
    that:
      - >-
        (ollama_api_dns_verify.json.result
        | selectattr('name', 'equalto', open_webui_proxy_ollama_domain)
        | selectattr('type', 'equalto', 'A') | list | length) == 1
    fail_msg: >-
      Cloudflare DNS verification failed. The Ollama API hostname must have
      exactly one A record before its address or proxy status is checked.
  no_log: true

- name: Verify the Ollama API A record points to Tailscale and is DNS-only
  ansible.builtin.assert:
    that:
      - >-
        ollama_api_dns_verify.json.result
        | selectattr('name', 'equalto', open_webui_proxy_ollama_domain)
        | list | length == 1
      - >-
        ollama_api_dns_verify.json.result
        | selectattr('type', 'in', ['CNAME', 'NS', 'AAAA'])
        | list | length == 0
      - >-
        (ollama_api_dns_verify.json.result
        | selectattr('type', 'equalto', 'A') | first).content
        == open_webui_proxy_tailscale_ip
      - >-
        not ((ollama_api_dns_verify.json.result
        | selectattr('type', 'equalto', 'A') | first).proxied | bool)
    fail_msg: >-
      Cloudflare DNS verification failed. The hostname must have one DNS-only
      A record pointing to the current Tailscale IPv4, with no conflicting
      record types.
  no_log: true

- name: Check whether the Ollama API TLS certificate already exists
  ansible.builtin.stat:
    path: "{{ open_webui_proxy_ollama_certificate_dir }}/fullchain.pem"
  register: ollama_api_certificate_stat

- name: Request the Ollama API TLS certificate using DNS-01
  ansible.builtin.command:
    argv:
      - certbot
      - certonly
      - --non-interactive
      - --agree-tos
      - --register-unsafely-without-email
      - --dns-cloudflare
      - --dns-cloudflare-credentials
      - "{{ open_webui_proxy_credentials_file }}"
      - --dns-cloudflare-propagation-seconds
      - "30"
      - --cert-name
      - "{{ open_webui_proxy_ollama_certificate_name }}"
      - -d
      - "{{ open_webui_proxy_ollama_domain }}"
  when: not ollama_api_certificate_stat.stat.exists
  no_log: true
