---
- name: Validate reverse proxy inputs
  ansible.builtin.assert:
    that:
      - open_webui_proxy_domain | length > 0
      - open_webui_proxy_domain is match('^[A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?([.][A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?)+$')
      - "'example.com' not in open_webui_proxy_domain"
      - lookup('ansible.builtin.env', 'CLOUDFLARE_API_TOKEN') | trim | length > 0
    fail_msg: >-
      Set CLOUDFLARE_API_TOKEN and replace the example domain in
      .secrets/.env before deploying the reverse proxy.
  no_log: true

- name: Verify Tailscale is installed and running
  ansible.builtin.command:
    argv:
      - tailscale
      - ip
      - -4
  register: open_webui_proxy_tailscale_ipv4
  changed_when: false
  failed_when: open_webui_proxy_tailscale_ipv4.rc != 0

- name: Validate the detected Tailscale IPv4 address
  ansible.builtin.assert:
    that:
      - open_webui_proxy_tailscale_ipv4.stdout | trim is match('^((25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])[.]){3}(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])$')
    fail_msg: "Tailscale did not return a usable IPv4 address."

- name: Set the Tailscale IPv4 address for Nginx
  ansible.builtin.set_fact:
    open_webui_proxy_tailscale_ip: "{{ open_webui_proxy_tailscale_ipv4.stdout_lines | first }}"

- name: Validate the detected LAN IPv4 address
  ansible.builtin.assert:
    that:
      - ansible_default_ipv4.address is defined
      - ansible_default_ipv4.address | trim is match('^((25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])[.]){3}(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])$')
    fail_msg: "Ansible could not detect a usable default-route LAN IPv4 address."

- name: Build unique Open WebUI Nginx listener addresses
  ansible.builtin.set_fact:
    open_webui_proxy_listen_ips: >-
      {{
        [
          ansible_default_ipv4.address | trim,
          open_webui_proxy_tailscale_ip | trim
        ] | unique | list
      }}

- name: Build unique Ollama API Nginx listener addresses
  ansible.builtin.set_fact:
    open_webui_proxy_ollama_listen_ips: >-
      {{
        [
          ansible_default_ipv4.address | trim,
          open_webui_proxy_tailscale_ip | trim
        ] | unique | list
      }}

- name: Wait for Open WebUI to respond on loopback
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: 3000
    state: started
    timeout: 120

- name: Install Nginx, Certbot, and Cloudflare DNS plugin
  ansible.builtin.apt:
    name:
      - nginx
      - certbot
      - python3-certbot-dns-cloudflare
      - curl
      - ca-certificates
    state: present
    update_cache: true
    policy_rc_d: 101

- name: Ensure Let's Encrypt credentials directory exists
  ansible.builtin.file:
    path: /etc/letsencrypt
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Install Cloudflare credentials for Certbot
  ansible.builtin.copy:
    dest: "{{ open_webui_proxy_credentials_file }}"
    owner: root
    group: root
    mode: "0600"
    content: |
      dns_cloudflare_api_token = {{ lookup('ansible.builtin.env', 'CLOUDFLARE_API_TOKEN') | trim }}
  no_log: true

- name: List Cloudflare zones accessible to the API token
  ansible.builtin.uri:
    url: "https://api.cloudflare.com/client/v4/zones?per_page=50&page=1&status=active"
    method: GET
    headers:
      Authorization: "Bearer {{ lookup('ansible.builtin.env', 'CLOUDFLARE_API_TOKEN') | trim }}"
      Accept: application/json
    return_content: true
    status_code: 200
    validate_certs: true
  failed_when: not (open_webui_proxy_cloudflare_zones.json.success | default(false) | bool)
  delegate_to: localhost
  become: false
  register: open_webui_proxy_cloudflare_zones
  no_log: true

- name: Initialize matching Cloudflare zones
  ansible.builtin.set_fact:
    open_webui_proxy_zone_matches: []

- name: Find zones that contain the requested domain
  ansible.builtin.set_fact:
    open_webui_proxy_zone_matches: >-
      {{ open_webui_proxy_zone_matches + [item] }}
  loop: "{{ open_webui_proxy_cloudflare_zones.json.result }}"
  when: >-
    open_webui_proxy_domain == item.name or
    open_webui_proxy_domain.endswith('.' ~ item.name)
  no_log: true

- name: Ensure a Cloudflare zone matches the domain
  ansible.builtin.assert:
    that:
      - open_webui_proxy_zone_matches | length > 0
    fail_msg: >-
      No accessible active Cloudflare zone matches OPEN_WEBUI_DOMAIN.
      Check the domain and the token's Zone Read permission.
  no_log: true

- name: Select the most specific matching Cloudflare zone
  ansible.builtin.set_fact:
    open_webui_proxy_cloudflare_zone_id: "{{ item.id }}"
    open_webui_proxy_cloudflare_zone_name: "{{ item.name }}"
  loop: "{{ open_webui_proxy_zone_matches }}"
  when: >-
    item.name | length >
    (open_webui_proxy_cloudflare_zone_name | default('') | length)
  no_log: true

- name: Retrieve existing DNS records for the domain
  ansible.builtin.uri:
    url: >-
      https://api.cloudflare.com/client/v4/zones/{{
      open_webui_proxy_cloudflare_zone_id }}/dns_records?name={{
      open_webui_proxy_domain | urlencode }}&per_page=100
    method: GET
    headers:
      Authorization: "Bearer {{ lookup('ansible.builtin.env', 'CLOUDFLARE_API_TOKEN') | trim }}"
      Accept: application/json
    return_content: true
    status_code: 200
    validate_certs: true
  failed_when: not (open_webui_proxy_dns_records.json.success | default(false) | bool)
  delegate_to: localhost
  become: false
  register: open_webui_proxy_dns_records
  no_log: true

- name: Refuse conflicting DNS record types
  ansible.builtin.assert:
    that:
      - >-
        open_webui_proxy_dns_records.json.result
        | selectattr('type', 'in', ['CNAME', 'NS', 'AAAA'])
        | list | length == 0
    fail_msg: >-
      DNS contains a conflicting CNAME, NS, or AAAA record. Review the DNS
      record manually before continuing.
  no_log: true

- name: Collect existing A records for the domain
  ansible.builtin.set_fact:
    open_webui_proxy_existing_a_records: >-
      {{ open_webui_proxy_dns_records.json.result
         | selectattr('type', 'equalto', 'A') | list }}

- name: Refuse ambiguous multiple A records
  ansible.builtin.assert:
    that:
      - open_webui_proxy_existing_a_records | length <= 1
    fail_msg: >-
      More than one A record exists for this hostname. Review the DNS records
      manually so unrelated destinations are not overwritten.

- name: Create the DNS-only A record pointing to Tailscale
  ansible.builtin.uri:
    url: "https://api.cloudflare.com/client/v4/zones/{{ open_webui_proxy_cloudflare_zone_id }}/dns_records"
    method: POST
    headers:
      Authorization: "Bearer {{ lookup('ansible.builtin.env', 'CLOUDFLARE_API_TOKEN') | trim }}"
      Accept: application/json
    body_format: json
    body:
      type: A
      name: "{{ open_webui_proxy_domain }}"
      content: "{{ open_webui_proxy_tailscale_ip }}"
      ttl: 1
      proxied: false
    return_content: true
    status_code: 200
    validate_certs: true
  failed_when: not (open_webui_proxy_dns_create.json.success | default(false) | bool)
  delegate_to: localhost
  become: false
  register: open_webui_proxy_dns_create
  when: open_webui_proxy_existing_a_records | length == 0
  no_log: true

- name: Update the existing A record to the current Tailscale address
  ansible.builtin.uri:
    url: >-
      https://api.cloudflare.com/client/v4/zones/{{
      open_webui_proxy_cloudflare_zone_id }}/dns_records/{{
      open_webui_proxy_existing_a_records[0].id }}
    method: PATCH
    headers:
      Authorization: "Bearer {{ lookup('ansible.builtin.env', 'CLOUDFLARE_API_TOKEN') | trim }}"
      Accept: application/json
    body_format: json
    body:
      content: "{{ open_webui_proxy_tailscale_ip }}"
      ttl: 1
      proxied: false
    return_content: true
    status_code: 200
    validate_certs: true
  failed_when: not (open_webui_proxy_dns_update.json.success | default(false) | bool)
  delegate_to: localhost
  become: false
  register: open_webui_proxy_dns_update
  when:
    - open_webui_proxy_existing_a_records | length == 1
    - >-
      open_webui_proxy_existing_a_records[0].content
      != open_webui_proxy_tailscale_ip
      or open_webui_proxy_existing_a_records[0].proxied | bool
  no_log: true

- name: Verify the Cloudflare DNS records after reconciliation
  ansible.builtin.uri:
    url: >-
      https://api.cloudflare.com/client/v4/zones/{{
      open_webui_proxy_cloudflare_zone_id }}/dns_records?name={{
      open_webui_proxy_domain | urlencode }}&per_page=100
    method: GET
    headers:
      Authorization: "Bearer {{ lookup('ansible.builtin.env', 'CLOUDFLARE_API_TOKEN') | trim }}"
      Accept: application/json
    return_content: true
    status_code: 200
    validate_certs: true
  failed_when: not (open_webui_proxy_dns_verify.json.success | default(false) | bool)
  delegate_to: localhost
  become: false
  register: open_webui_proxy_dns_verify
  no_log: true

- name: Collect verified Cloudflare DNS records
  ansible.builtin.set_fact:
    open_webui_proxy_verified_records: "{{ open_webui_proxy_dns_verify.json.result }}"
    open_webui_proxy_verified_a_records: >-
      {{ open_webui_proxy_dns_verify.json.result
         | selectattr('type', 'equalto', 'A') | list }}
  no_log: true

- name: Assert Cloudflare returned records for the exact hostname
  ansible.builtin.assert:
    that:
      - open_webui_proxy_verified_records | length > 0
      - >-
        open_webui_proxy_verified_records | map(attribute='name') | unique | list
        == [open_webui_proxy_domain]
    fail_msg: >-
      Cloudflare DNS verification failed: returned records do not match
      the exact configured hostname.
  no_log: true

- name: Assert no conflicting DNS record types remain
  ansible.builtin.assert:
    that:
      - >-
        open_webui_proxy_verified_records
        | selectattr('type', 'in', ['CNAME', 'NS', 'AAAA'])
        | list | length == 0
    fail_msg: >-
      Cloudflare DNS verification failed: conflicting CNAME, NS, or AAAA
      records remain for the configured hostname.
  no_log: true

- name: Assert exactly one Cloudflare A record exists after reconciliation
  ansible.builtin.assert:
    that:
      - open_webui_proxy_verified_a_records | length == 1
    fail_msg: >-
      Cloudflare DNS verification failed: expected exactly one A record
      for the configured hostname.
  no_log: true

- name: Assert Cloudflare A record matches the Tailscale IPv4 address
  ansible.builtin.assert:
    that:
      - open_webui_proxy_verified_a_records[0].name == open_webui_proxy_domain
      - open_webui_proxy_verified_a_records[0].content == open_webui_proxy_tailscale_ip
      - not (open_webui_proxy_verified_a_records[0].proxied | bool)
    fail_msg: >-
      Cloudflare DNS verification failed: the A record must match the exact
      hostname and current Tailscale IPv4 address with proxying disabled.
  no_log: true

- name: Check whether the TLS certificate already exists
  ansible.builtin.stat:
    path: "{{ open_webui_proxy_certificate_dir }}/fullchain.pem"
  register: open_webui_proxy_certificate_stat

- name: Request the Let's Encrypt certificate using DNS-01
  ansible.builtin.command:
    argv:
      - certbot
      - certonly
      - --non-interactive
      - --agree-tos
      - --register-unsafely-without-email
      - --dns-cloudflare
      - --dns-cloudflare-credentials
      - "{{ open_webui_proxy_credentials_file }}"
      - --dns-cloudflare-propagation-seconds
      - "30"
      - --cert-name
      - "{{ open_webui_proxy_certificate_name }}"
      - -d
      - "{{ open_webui_proxy_domain }}"
  when: not open_webui_proxy_certificate_stat.stat.exists
  no_log: true

- name: Configure the private Ollama API DNS and certificate
  ansible.builtin.include_tasks: ollama-api.yml

- name: Ensure Certbot renewal deploy-hook directory exists
  ansible.builtin.file:
    path: /etc/letsencrypt/renewal-hooks/deploy
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install the Certbot renewal deploy hook
  ansible.builtin.template:
    src: reload-nginx.sh.j2
    dest: "{{ open_webui_proxy_renewal_hook }}"
    owner: root
    group: root
    mode: "0750"

- name: Install the Tailscale IP readiness script
  ansible.builtin.template:
    src: wait-for-tailscale-ip.sh.j2
    dest: "{{ open_webui_proxy_tailscale_wait_script }}"
    owner: root
    group: root
    mode: "0750"

- name: Ensure Nginx systemd drop-in directory exists
  ansible.builtin.file:
    path: "{{ open_webui_proxy_systemd_dropin_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Configure Nginx to wait for Tailscale
  ansible.builtin.copy:
    dest: "{{ open_webui_proxy_systemd_dropin }}"
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      Requires=tailscaled.service
      After=tailscaled.service network-online.target
      Wants=network-online.target

      [Service]
      ExecStartPre=
      ExecStartPre={{ open_webui_proxy_tailscale_wait_script }}
      ExecStartPre=/usr/sbin/nginx -t -q -g 'daemon on; master_process on;'
      Restart=on-failure
      RestartSec=5s
  register: open_webui_proxy_systemd_config
  notify: Restart Nginx

- name: Ensure Nginx sites-enabled directory exists
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Disable the default Nginx site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Restart Nginx

- name: Deploy the Open WebUI Nginx site
  ansible.builtin.template:
    src: nginx-site.conf.j2
    dest: "{{ open_webui_proxy_nginx_site_available }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart Nginx

- name: Enable the Open WebUI Nginx site
  ansible.builtin.file:
    src: "{{ open_webui_proxy_nginx_site_available }}"
    dest: "{{ open_webui_proxy_nginx_site_enabled }}"
    state: link
    owner: root
    group: root
  notify: Restart Nginx

- name: Install the Ollama API authorization map
  ansible.builtin.template:
    src: ollama-api-auth.conf.j2
    dest: "{{ open_webui_proxy_ollama_auth_map_file }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: Restart Nginx

- name: Deploy the private Ollama API Nginx site
  ansible.builtin.template:
    src: ollama-api-site.conf.j2
    dest: "{{ open_webui_proxy_ollama_nginx_site_available }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart Nginx

- name: Enable the private Ollama API Nginx site
  ansible.builtin.file:
    src: "{{ open_webui_proxy_ollama_nginx_site_available }}"
    dest: "{{ open_webui_proxy_ollama_nginx_site_enabled }}"
    state: link
    owner: root
    group: root
  notify: Restart Nginx

- name: Reload systemd after Nginx dependency changes
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: open_webui_proxy_systemd_config.changed

- name: Apply pending Nginx changes before validation
  ansible.builtin.meta: flush_handlers

- name: Validate Nginx configuration
  ansible.builtin.command:
    argv:
      - nginx
      - -t
  changed_when: false

- name: Ensure Nginx is enabled and running
  ansible.builtin.systemd_service:
    name: nginx
    state: started
    enabled: true

- name: Verify HTTPS access locally through the Tailscale interface
  ansible.builtin.command:
    argv:
      - curl
      - --silent
      - --show-error
      - --output
      - /dev/null
      - --write-out
      - "%{http_code}"
      - --max-time
      - "10"
      - --resolve
      - "{{ open_webui_proxy_domain }}:443:{{ open_webui_proxy_tailscale_ip }}"
      - "https://{{ open_webui_proxy_domain }}/"
  register: open_webui_proxy_https_check
  changed_when: false
  failed_when: false
  retries: 12
  delay: 5
  until:
    - open_webui_proxy_https_check.rc == 0
    - open_webui_proxy_https_check.stdout is match('^[23][0-9][0-9]$')

- name: Verify the Ollama API rejects requests without a Bearer token
  ansible.builtin.command:
    argv:
      - curl
      - --silent
      - --show-error
      - --output
      - /dev/null
      - --write-out
      - "%{http_code}"
      - --max-time
      - "10"
      - --resolve
      - "{{ open_webui_proxy_ollama_domain }}:443:{{ open_webui_proxy_tailscale_ip }}"
      - "https://{{ open_webui_proxy_ollama_domain }}/api/tags"
  register: ollama_api_unauthenticated_check
  changed_when: false
  failed_when: false
  retries: 6
  delay: 2
  until:
    - ollama_api_unauthenticated_check.rc == 0
    - ollama_api_unauthenticated_check.stdout == "401"

- name: Assert the Ollama API rejects unauthenticated requests
  ansible.builtin.assert:
    that:
      - ollama_api_unauthenticated_check.rc == 0
      - ollama_api_unauthenticated_check.stdout == "401"
    fail_msg: >-
      The Ollama API endpoint did not return HTTP 401 without a Bearer token.
      Check the Nginx authorization map and API virtual host.

- name: Verify the Ollama API accepts a valid Bearer token
  ansible.builtin.uri:
    url: "https://{{ open_webui_proxy_ollama_domain }}/api/tags"
    method: GET
    headers:
      Authorization: "Bearer {{ lookup('ansible.builtin.env', 'OLLAMA_API_KEY') | trim }}"
      Accept: application/json
    return_content: false
    status_code: 200
    validate_certs: true
    timeout: 10
  register: ollama_api_authenticated_check
  changed_when: false
  failed_when: false
  retries: 6
  delay: 2
  until: ollama_api_authenticated_check.status | default(0) == 200
  no_log: true

- name: Assert the Ollama API accepts the configured Bearer token
  ansible.builtin.assert:
    that:
      - ollama_api_authenticated_check.status | default(0) == 200
    fail_msg: >-
      The Ollama API did not return HTTP 200 with the configured Bearer token.
      Check API key consistency, DNS resolution, TLS, and Nginx authorization.
  no_log: true

- name: Assert that the HTTPS endpoint responds successfully
  ansible.builtin.assert:
    that:
      - open_webui_proxy_https_check.rc == 0
      - open_webui_proxy_https_check.stdout is match('^[23][0-9][0-9]$')
    fail_msg: >-
      HTTPS did not return a 2xx or 3xx response after retries.
      Check Nginx, the certificate, Open WebUI, and the Tailscale interface.
